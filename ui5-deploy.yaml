# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zserviceportal
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CRD
          url: http://crdb00:8000
          client: '030'
        app:
          name: ZSERVICEPORTAL
          package: ZSBS_CRM
          transport: CRDK925756
        exclude:
          - /test/
